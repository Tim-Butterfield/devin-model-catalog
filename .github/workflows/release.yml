# Publishes a release when a version tag is pushed. Everything it builds comes
# from scripts/release.sh, which is the same script a maintainer runs locally,
# so what a tag publishes is what a dry run produces.
#
# The work is split across two jobs on purpose. The job that checks out and
# executes repository code holds no token that can publish anything; the job
# that can publish never checks out or runs repository code. An artifact is the
# only thing that crosses between them, and it is re-verified on arrival.
#
# Actions are pinned to full commit SHAs, because a tag can be moved to point at
# different code. The trailing comment records which release each SHA is.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Deny everything by default; each job grants itself only what it needs.
permissions: {}

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only. This job compiles and packages, and must not be able to create
    # a release, mint an OIDC token or write an attestation.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Refuse a tag that is not a version before anything is built, so a
      # mistyped tag cannot produce a release. The tag reaches the shell as an
      # environment variable rather than by interpolation.
      - name: Validate the tag
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release.sh --check-version "$TAG"

      # The notes are written here, in the job that has the repository, so the
      # publishing job never needs to check out to find them.
      - name: Extract the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release.sh --notes "$TAG" > release-notes.md

      - name: Build and package every target
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release.sh "$TAG"

      - name: Verify the checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # Uploaded only after the checksums verify, so a bad build cannot be
      # handed on. compression-level 0 because the payload is already
      # compressed.
      - name: Upload the release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish and attest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job with write access, and it never runs repository code.
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Mint the short-lived OIDC token the attestation is signed with.
      id-token: write
      # Persist the provenance attestation.
      attestations: write
    steps:
      # No checkout: this job publishes what the build job produced and needs
      # nothing from the source tree. download-artifact fails on a digest
      # mismatch by default.
      - name: Download the release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload
          path: .

      # Nothing is attested or published until the payload is exactly what the
      # build job should have produced: these six archives, the checksum file
      # and the notes, with nothing missing and nothing extra.
      - name: Verify the artifact inventory
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          bad=0
          for f in \
            "devmodels_${version}_darwin_arm64.tar.gz" \
            "devmodels_${version}_darwin_amd64.tar.gz" \
            "devmodels_${version}_linux_amd64.tar.gz" \
            "devmodels_${version}_linux_arm64.tar.gz" \
            "devmodels_${version}_windows_amd64.zip" \
            "devmodels_${version}_windows_arm64.zip" \
            SHA256SUMS; do
            if [ ! -f "dist/$f" ]; then
              echo "missing from the payload: $f" >&2
              bad=1
            fi
          done
          count=$(ls -1A dist | wc -l)
          if [ "$count" -ne 7 ]; then
            echo "dist holds $count entries, expected exactly 7:" >&2
            ls -1A dist >&2
            bad=1
          fi
          if [ ! -s release-notes.md ]; then
            echo "missing or empty: release-notes.md" >&2
            bad=1
          fi
          exit "$bad"

      # Re-verified after the handoff, not just before it.
      - name: Re-verify the checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # One attestation covers every archive, because SHA256SUMS names and
      # digests all of them. Consumers verify with:
      #   gh attestation verify <archive> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "devmodels $TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/devmodels_*.tar.gz \
            dist/devmodels_*.zip \
            dist/SHA256SUMS
